
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1565c0">
<title>मेरी डिजिटल स्लेट</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#edf2f7}
body{display:flex;flex-direction:column}
header{background:#1565c0;color:white;text-align:center;padding:12px 5px;font-size:21px;font-weight:bold;flex-shrink:0}
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;padding:9px;background:white;box-shadow:0 2px 5px #0002;flex-shrink:0}
button{border:1px solid #cbd5e1;background:#f8fafc;color:#172033;border-radius:9px;min-height:42px;padding:9px 11px;font-size:14px;font-weight:bold}
button.active{background:#1565c0;color:white;border-color:#1565c0}
button:active{transform:scale(.97)}
.colorbox,.sizebox{display:flex;align-items:center;gap:5px;font-size:13px}
input[type=color]{width:34px;height:32px;border:0;padding:0;background:transparent}
input[type=range]{width:80px;accent-color:#1565c0}
#board{flex:1;min-height:0;padding:7px;display:flex}
#paper{flex:1;min-height:0;min-width:0;background:white;border:2px solid #cbd5e1;border-radius:10px;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
footer{flex-shrink:0;background:white;color:#64748b;text-align:center;font-size:12px;padding:7px}
</style>
</head>
<body>
<header>✍️ मेरी डिजिटल स्लेट</header>

<div class="toolbar">
  <button id="finger" class="active">☝️ उंगली</button>
  <button id="pen">🖊️ पेन</button>
  <button id="eraser">🧽 इरेज़र</button>

  <label class="colorbox">🎨 रंग
    <input type="color" id="color" value="#111111">
  </label>

  <label class="sizebox">मोटाई
    <input type="range" id="size" min="1" max="35" value="4">
    <span id="sizeNum">4</span>
  </label>

  <button id="undo">↩️ Undo</button>
  <button id="clear">🗑️ साफ</button>
  <button id="save">💾 PNG सेव</button>
</div>

<main id="board">
  <div id="paper"><canvas id="canvas"></canvas></div>
</main>
<footer>उंगली या टच पेन से लिखें • इरेज़र से मिटाएँ • PNG सेव करें</footer>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);

let mode="finger";
let drawing=false;
let current=null;
let strokes=[];
let dpr=1;

function setMode(m){
  mode=m;
  ["finger","pen","eraser"].forEach(id=>{
    $(id).classList.toggle("active",id===m);
  });
}

$("finger").onclick=()=>setMode("finger");
$("pen").onclick=()=>setMode("pen");
$("eraser").onclick=()=>setMode("eraser");

$("size").oninput=()=>{$("sizeNum").textContent=$("size").value};

function point(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

function resize(){
  const old=document.createElement("canvas");
  old.width=canvas.width;
  old.height=canvas.height;
  if(old.width && old.height){
    old.getContext("2d").drawImage(canvas,0,0);
  }

  const r=canvas.getBoundingClientRect();
  if(!r.width||!r.height)return;

  dpr=Math.min(window.devicePixelRatio||1,3);
  canvas.width=Math.round(r.width*dpr);
  canvas.height=Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,r.width,r.height);

  if(old.width&&old.height){
    ctx.drawImage(old,0,0,old.width,old.height,0,0,r.width,r.height);
  }
}

function drawStroke(s){
  if(!s||!s.points.length)return;
  ctx.save();
  ctx.strokeStyle=s.color;
  ctx.fillStyle=s.color;
  ctx.lineWidth=s.width;
  ctx.lineCap="round";
  ctx.lineJoin="round";

  const p=s.points;
  if(p.length===1){
    ctx.beginPath();
    ctx.arc(p[0].x,p[0].y,s.width/2,0,Math.PI*2);
    ctx.fill();
  }else{
    ctx.beginPath();
    ctx.moveTo(p[0].x,p[0].y);
    for(let i=1;i<p.length;i++){
      ctx.lineTo(p[i].x,p[i].y);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function redraw(){
  const r=canvas.getBoundingClientRect();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,r.width,r.height);
  strokes.forEach(drawStroke);
  if(current)drawStroke(current);
}

canvas.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  e.preventDefault();
  drawing=true;
  const p=point(e);

  // Finger and Pen are separate user-selectable modes.
  current={
    mode:mode,
    color:mode==="eraser"?"#ffffff":$("color").value,
    width:mode==="eraser"
      ?Math.max(18,Number($("size").value)*3)
      :Number($("size").value),
    points:[p]
  };

  try{canvas.setPointerCapture(e.pointerId)}catch(err){}
  redraw();
});

canvas.addEventListener("pointermove",e=>{
  if(!drawing||!current)return;
  e.preventDefault();
  const p=point(e);
  const points=current.points;
  const prev=points[points.length-1];
  points.push(p);

  ctx.beginPath();
  ctx.strokeStyle=current.color;
  ctx.lineWidth=current.width;
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.moveTo(prev.x,prev.y);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
});

function finish(){
  if(!drawing)return;
  drawing=false;
  if(current)strokes.push(current);
  current=null;
}
canvas.addEventListener("pointerup",finish);
canvas.addEventListener("pointercancel",finish);
canvas.addEventListener("lostpointercapture",finish);

$("undo").onclick=()=>{
  finish();
  strokes.pop();
  redraw();
};

$("clear").onclick=()=>{
  if(!confirm("पूरी स्लेट साफ करें?"))return;
  drawing=false;
  current=null;
  strokes=[];
  redraw();
};

$("save").onclick=()=>{
  finish();
  const out=document.createElement("canvas");
  out.width=canvas.width;
  out.height=canvas.height;
  const c=out.getContext("2d");
  c.fillStyle="#fff";
  c.fillRect(0,0,out.width,out.height);
  c.drawImage(canvas,0,0);

  out.toBlob(blob=>{
    if(!blob){alert("सेव नहीं हो सका।");return}
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="meri-digital-slate.png";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  },"image/png");
};

let timer;
window.addEventListener("resize",()=>{
  clearTimeout(timer);
  timer=setTimeout(resize,150);
});
resize();
</script>
</body>
</html>
